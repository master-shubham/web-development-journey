<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <title>LeetMetricsKing</title>
</head>
<body>
    
    <div class="container">
        <h1>LeetMetricsKing</h1>
        <div class="user-container">
            <p>Enter your username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter your username here" id="user-input">
                <button class="search-btn">Search</button>
            </div> 
        </div>  
        <div class="stats-container">
            <div class="progress">
                <div class="progress-item circle  easy-circle">
                    <div class="easy-progress">
                        <span class="easy-label"></span>
                        <p>Easy</p>
                    </div>
                </div>
                <div class="progress-item circle  medium-circle">
                    <div class="medium-progress">
                        <span class="medium-label"></span>
                        <p>Medium</p>
                    </div>
                </div>
                <div class="progress-item circle  hard-circle">
                    <div class="hard-progress">
                        <span class="hard-label"></span>
                        <p>Hard</p>
                    </div>
                </div>
            </div>

            <div class="stats-card">
                <!-- directly populate card here from the JS code  -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
