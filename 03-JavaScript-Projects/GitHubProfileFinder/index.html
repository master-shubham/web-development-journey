<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
</head>
<body>
    <div class="container">
        <div class="search-box">
                <input type="text" placeholder="Enter username here" class="input-text">
                <button class="search-btn">Search</button>
        </div>

        <section class="profile-container">
            <div class="profile-avatar-img">
                <img src="" alt="">
            </div>
            <div class="profile-details">
                <div class="profile-info">
                      <h1>The Octocat</h1>
                        <p>@octocat</p>
                        <p>Bio</p>
                </div>
                <div class="profile-link">
                    <p>location</p>
                    <p>link github</p>
                    <p>date</p>
                </div>
            </div>

        </section>
        <div class="social-network">
            <div class="grid-lists">
                <div class="followers">
                    <img src="" alt="">
                    <p>Followers</p>
                    <p>4.2</p>
                </div>
                <div class="following">
                    <img src="" alt="">
                    <p>Following</p>
                    <p>9</p>
                </div>
                <div class="repositories">
                    <img src="" alt="">
                    <p>Repositories</p>
                    <p>8</p>
                </div>
                <div class="publicGists">
                    <img src="" alt="">
                    <p>PublicGists</p>
                    <p>8</p>
                </div>
            </div>
        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
