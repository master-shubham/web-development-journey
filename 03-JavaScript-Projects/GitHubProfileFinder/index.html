<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <title>GitHub Profile Finder</title>
  </head>
  <body>
    <div class="container">
      <div class="search-box">
        <input
          type="text"
          placeholder="Enter username here"
          class="input-text"
        />
        <button class="search-btn">Search</button>
      </div>

      <section class="profile-container">
        <div class="profile-avatar-img">
          <img src="photoin.jpg" alt="profile-avatar" class="profile-avatar" />
        </div>
        <div class="profile-details">
          <div class="profile-info">
            <h1 class="profile-name">Name</h1>
            <p class="profile-username">@username</p>
            <p class="profile-bio">
              user bio Lorem ipsum, dolor sit amet consectetur adipisicing elit.
              Rerum reprehenderit.
            </p>
          </div>
          <div class="profile-link">
            <p class="profile-location">
              <a href="#" target="_blank"></a
              ><i class="fa-solid fa-location-dot"></i>
            </p>
            <p class="profile-github-link">
              <a href="#" target="_blank"
                ><i class="fa-brands fa-github"></i
              ></a>
            </p>
            <p class="profile-date">
              <a href="#" target="_blank"
                ><i class="fa-regular fa-calendar-days"></i
              ></a>
            </p>
          </div>
        </div>
      </section>
      <div class="social-Statistics">
        <div class="grid-lists">
          <div class="followers social-info">
            <i class="fa-solid fa-users"></i>
            <p>Followers</p>
            <p>4.2</p>
          </div>
          <div class="following social-info">
            <i class="fa-solid fa-users"></i>
            <p>Following</p>
            <p>9</p>
          </div>
          <div class="repositories social-info">
            <i class="fa-regular fa-file-lines"></i>
            <p>Repositories</p>
            <p>8</p>
          </div>
          <div class="publicGists social-info">
            <i class="fa-regular fa-star"></i>
            <p>PublicGists</p>
            <p>8</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
