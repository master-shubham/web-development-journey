<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Color Changer</title>
</head>
<body>
   <div class="container">
     <h1 class="heading">Color Changer 🎨</h1>
    <div class="btn-list">
      <button class="btn-color" data-color="red">Red</button>
<button class="btn-color" data-color="blue">Blue</button>
<button class="btn-color" data-color="green">Green</button>
<button class="btn-color" data-color="black">Black</button>
    </div>
    <p class="curr-text">Current Color: <span class="curr-color-text">White</span> </p>
    <button class="btn-reset">Reset</button>
   </div>


    <script src="script.js"></script>
</body>
</html>
