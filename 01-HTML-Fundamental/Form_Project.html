     <!-- Project 3 -->
    <h1>Complex Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="username">Name:</label>
            <input type="text" id="username">
            <br>
            <br>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail">
            <br>
            <br>
            <label for="userphone">Phone:</label>
            <input type="tel" id="userphone">
            <br>
            <br>
            <label for="dateofbirth">Date of Birth</label>
            <input type="date" id="dateofbirth">
            <br>
            <br>

            Gender
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <br>
            <br>
             <label for="country">Country</label>
            <select name="country" id="country">
                <option value="" hidden>-- Choose a country --</option>
                <option value="hs">India</option>
                <option value="tth">UK</option>
                <option value="clg">Landon</option>
                <option value="clg">Newyork</option>
                <option value="other">other</option>
        </select>
        </fieldset>

            <fieldset>
                <legend>Address</legend>
                <label for="street">Street:</label>
                <input type="text" id="street">
                <br><br>
                <label for="city">City:</label>
                <input type="text" id="city">
                <br><br>
                <label for="State">State:</label>
                <input type="text" id="State">
                <br><br>
                <label for="zipcode">Zip Code:</label>
                <input type="text" id="zipcode">
                <br><br>
            </fieldset>

            <fieldset>
                <legend>Other Information</legend>
                <label for="comment">Comments</label>
                <textarea name="comment" id="comment" rows="5" cols="40"></textarea>
                <br>
                <label for="term">I agree to the terms of service</label>
                <input type="checkbox" name="terms" id="term" required>
            </fieldset>

            <br>
            <input type="submit" value="Submit">

    </form>

</body>
