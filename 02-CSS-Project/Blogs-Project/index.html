<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>BlogsKing</title>
</head>
<body class="body_container">
    <div class="container">
        <header class="header_container">
            <h1 class="header_title">Blogs King</h1>
            <p class="header_desc">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Cum fuga atque, laborum ratione hic at architecto officiis.</p>
        </header>
        <main class="main_container">
            <!-- *card start 1 -->
             <div class="card_container">
                <a href="#" class="card_img_container">
                    <img src="https://picsum.photos/800/600?random=1" alt="card img" class="card_img" loading="lazy">
                </a>
                <div class="card_title_container">
                    <a href="#">
                        <h2>New Gadget Released</h2>
                    </a>
                    <p class="card_desc">Lorem ipsum dolor sit amet consectetur adipisicing elit. </p>
                </div>
                <div class="card_footer_container">
                    <div class="author_container">
                        <div class="author_avatar_container">
                            <img src="https://api.dicebear.com/7.x/notionists/svg?seed=John?size=64" alt="author_avatar"
                            class="author_avatar" loading="lazy">
                        </div>
                        <div class="author_info_container">
                            <span>Jone Den</span>
                            <span>Sept 9,2021</span>
                        </div>

                    </div>
                    <div class="card_tag_container">
                        <span>Technology</span>
                    </div>
                </div>
             </div>
            <!-- *card end 1 -->
        </main>
    </div>
</body>
</html>
