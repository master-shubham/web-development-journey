<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            width: 100vw;
            background-color: aqua;
            border: 5px solid black;
        }
        .box1{
            width: 350px;
            height: 80px;
            background-color: blue;
            border-radius: 10px;
            border: 4px solid yellow;
            margin: 10px;
            position: relative;
          /*  animation-name: rightMovement;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
            animation-timing-function: linear;
            animation-direction: alternate; */

            /* @keyframes duration | easing-function | delay |
            iteration-count | direction | fill-mode | play-state | name */
            animation: 5s linear 2s infinite alternate none running rightMovement;
        }

        @keyframes rightMovement {
            from{
                top: 0;
                left: 0;
            }
            to{
                top: 0;
                left: 1130px;
            }
        }

        .box2{
            width: 350px;
            height: 80px;
            background-color: rgb(13, 45, 42);
            border-radius: 10px;
            border: 4px solid yellow;
            margin: 10px;
            position: relative;
             animation: 5s linear 2s infinite alternate none running leftMovement;
        }

        @keyframes leftMovement {
            from{
                top: 530px;
                left: 1130px;
            }
            to{
                top: 530px;
                left: 0;
            }
        }

        #circle{
           width: 100px;
            height: 100px;
            background-color: rgb(153, 185, 212);
            border-radius: 50%;
            border: 4px solid yellow;
            margin: 10px;
            position: relative; 
            top: 30%;
            left: 40%; 
            animation: 10s ease-in-out 0s infinite alternate none running circleMovement; 
        }
         @keyframes circleMovement {
           0%{
                top: 1%;
                left: 5%;
           }
           30%{
                top: 5%;
                left: 90%;
           }
           60%{
                top: 47%;
                left: 10%;
           }
           100%{
                top: 47%;
                left: 90%;
           }
        }



    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div id="circle"></div>
    </div>
</body>
</html>
