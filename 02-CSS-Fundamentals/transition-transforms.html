        .box{
            width: 400px;
            height: 400px;
            background-color: aqua;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            transition: all 2s ease;
        }

        .container{
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box:hover{
            /* transform: rotate(45deg);
            transform: scale(0.6);  
            transform: skew(-45deg);  */
            transform: translate(0px,500px);
        }
        p{
            font-size: 18px;
        }

<body>
    <!-- <div class="box"></div> -->
   <div class="container">
     <div class="box">
        <p>Welcome to Transforms</p>
