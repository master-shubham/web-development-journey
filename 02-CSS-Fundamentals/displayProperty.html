    <title>Display</title>

    *{
        margin: 10px;
        padding: 0;
        box-sizing: border-box;
    }

    .box{
        width: 300px;

        border: 1px solid black;
        padding: 100px;
    }

    span{
        border: 2px solid red;
        width: 200px;
        height: 200px;
        margin: 10px;
        padding: 10px;
        display: inline-block;
        /* display: block;  */
    }

        padding: 50px;
    }  */
   </style>
</head>
<body>

        hello world-1
    </span>
    <span>
        hello world-2
    </span>

</html>
